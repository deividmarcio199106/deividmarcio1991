[project]
name = "qlab"
version = "0.1.0"
description = "Laboratório quantitativo de pesquisa WIN/WDO (sem execução de ordens)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E741", "B905"]
